spring.application.name=payments-service

server.port=8084


# ========================================
# DATABASE
# ========================================

spring.datasource.url=jdbc:mysql://localhost:3306/payment
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ========================================
# JPA / HIBERNATE
# ========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ========================================
# KAFKA
# ========================================

spring.kafka.bootstrap-servers=localhost:9092


# ========================================
# KAFKA PRODUCER
# ========================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# ========================================
# KAFKA CONSUMER
# ========================================

spring.kafka.consumer.group-id=payment-service

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.IntegerDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# ========================================
# JSON DESERIALIZATION
# ========================================

spring.kafka.consumer.properties.spring.json.trusted.packages=com.demo.*

spring.kafka.consumer.properties.spring.json.value.default.type=com.demo.payments.dao.Orders

spring.kafka.consumer.properties.spring.json.use.type.headers=false


# ========================================
# LOGGING
# ========================================

logging.level.org.springframework.kafka=INFO