spring.application.name=notification-service

server.port=8083


# =========================
# DATABASE
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/notification
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================
# KAFKA
# =========================

spring.kafka.bootstrap-servers=localhost:9092


# =========================
# KAFKA CONSUMER
# =========================

spring.kafka.consumer.group-id=notification-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.IntegerDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# =========================
# JSON DESERIALIZATION
# =========================

spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafka.demo.Notification.*

spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.demo.Notification.dao.PaymentEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false


# =========================
# LOGGING
# =========================

logging.level.org.springframework.kafka=INFO